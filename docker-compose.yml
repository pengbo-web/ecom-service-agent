services:
  ecom-agent:
    build: .
    ports:
      - "8010:8010"
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0        # 容器内需监听 0.0.0.0 才能被宿主访问
      - REDIS_URL=redis://redis:6379/0   # 容器内连 redis 服务(覆盖 .env 的 localhost)
      - MCP_SERVER_URL=http://mcp-server:9123/mcp   # 容器内用服务名连 MCP(覆盖 .env 的 127.0.0.1)
    volumes:
      - ./app/sessions:/app/app/sessions   # 会话/DB/Trace 持久化
    depends_on:
      - redis
      - mcp-server
    restart: unless-stopped

  # MCP 工具 server(可选常驻):把电商工具经 MCP 协议暴露在 9123。
  # 复用主镜像,command 换;挂载同 app/sessions 以共享 ecom.db(订单归属校验读它)。
  # MCP_ENABLED=false:server 自身不作为 MCP client,避免自连。
  mcp-server:
    build: .
    command: python mcp_server/server.py
    ports:
      - "9123:9123"
    env_file:
      - .env
    environment:
      - MCP_ENABLED=false
    volumes:
      - ./app/sessions:/app/app/sessions
    depends_on:
      - redis
    restart: unless-stopped

  # 会话存储 Redis(R1-R5)。--appendonly yes 开 AOF 持久化(默认 appendfsync everysec):
  # Redis 崩溃/重启最多丢 ~1s 写,步级 checkpoint 与挂起动作基本不丢。命名卷让数据持久。
  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ecom-redis-data:/data
    restart: unless-stopped

volumes:
  ecom-redis-data:
